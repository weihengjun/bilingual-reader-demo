<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>彩云小译 · 双语阅读主题 Demo</title>
<style>
  :root {
    --bg: #f5f5f5;
    --text: #1a1a1a;
    --line: #d6d3cd;
    --font: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    transition: background-color .3s, color .3s;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }

  /* ---------- Reader ---------- */
  .reader {
    max-width: 880px; /* 文字区 800px + 左右各 40px */
    margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top)) 40px calc(120px + env(safe-area-inset-bottom));
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .title { font-size: 22px; font-weight: 600; line-height: 32px; margin: 0 0 32px; }
  .title .zh { display: block; font-size: 18px; font-weight: 500; line-height: 26px; letter-spacing: 2px; margin-top: 4px; }
  .title .en { opacity: .6; }
  .block { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
  .block h3 { margin: 0; font-size: 18px; font-weight: 500; line-height: 25px; }
  .pair { display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
  .pair .src { margin: 0; line-height: 23px; opacity: .6; }
  .pair .tgt { margin: 0; line-height: 25.6px; letter-spacing: 2px; }
  .divider { width: 60px; height: 1px; background: var(--line); margin: 0 auto 32px; }
  .body { display: flex; flex-direction: column; gap: 24px; }

  /* ---------- Floating button ---------- */
  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--text); color: var(--bg);
    font-size: 18px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: transform .15s, background-color .3s, color .3s;
    z-index: 10;
  }
  .fab:active { transform: scale(.94); }

  /* ---------- Sheets ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 560px;
    transform: translate(-50%, 105%);
    background: var(--panel); color: var(--text);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    transition: transform .3s cubic-bezier(.2,.8,.2,1), background-color .3s, color .3s;
    z-index: 30; max-height: 85vh; overflow-y: auto;
  }
  .sheet.show { transform: translate(-50%, 0); }
  @media (min-width: 720px) {
    .sheet { bottom: 24px; border-radius: 20px; }
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .close { border: none; background: none; font-size: 22px; line-height: 1; cursor: pointer; opacity: .5; padding: 4px 8px; }
  .label { font-size: 13px; opacity: .55; margin: 18px 0 10px; }

  .segment {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
    border-radius: 12px; background: var(--chip);
  }
  .segment button {
    border: none; background: transparent; padding: 9px 0; border-radius: 9px;
    font-size: 15px; cursor: pointer; opacity: .6; transition: all .2s;
  }
  .segment button.on { background: var(--bg); opacity: 1; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .themes { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 8px; border-radius: 999px; cursor: pointer;
    background: var(--chip); border: 1.5px solid transparent; font-size: 14px;
    transition: border-color .2s;
  }
  .chip.on { border-color: var(--text); }
  .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
  .tag {
    font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 4px;
    border: 1px solid currentColor; opacity: .6;
  }
  .del {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--text); color: var(--bg); font-size: 12px; line-height: 18px;
    padding: 0; cursor: pointer;
  }
  .palette-dot { background: conic-gradient(#f55, #fc5, #5d7, #5cf, #75f, #f5c, #f55); }

  /* ---------- Palette ---------- */
  .preview {
    border-radius: 14px; padding: 18px 20px; transition: background-color .2s, color .2s;
    box-shadow: inset 0 0 0 1px rgba(127,127,127,.2);
  }
  .preview .meta { font-size: 12px; opacity: .6; margin-top: 12px; font-family: ui-monospace, Menlo, monospace; }
  .picker-row { display: flex; align-items: center; gap: 12px; }
  .picker-row input[type=color] {
    width: 48px; height: 48px; border: none; padding: 0; background: none; cursor: pointer; flex: none;
  }
  .picker-row input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .picker-row input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .picker-row input[type=color]::-moz-color-swatch { border: none; border-radius: 50%; }
  .hue {
    -webkit-appearance: none; appearance: none; flex: 1; height: 14px; border-radius: 7px;
    background: linear-gradient(90deg, hsl(0,90%,55%), hsl(60,90%,55%), hsl(120,90%,55%), hsl(180,90%,55%), hsl(240,90%,55%), hsl(300,90%,55%), hsl(360,90%,55%));
    outline: none;
  }
  .hue::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 2px solid rgba(0,0,0,.25); box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer;
  }
  .hue::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.25); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .quick button { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(127,127,127,.3); }
  .rule { font-size: 12px; line-height: 18px; opacity: .55; margin-top: 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .actions button {
    border: none; border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--text); color: var(--bg) !important; }
  .btn-secondary { background: var(--chip); }

  .toast {
    position: fixed; left: 50%; top: calc(24px + env(safe-area-inset-top)); transform: translate(-50%, -20px);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<main class="reader" id="reader"></main>

<button class="fab" id="fab" aria-label="阅读主题">Aa</button>
<div class="mask" id="mask"></div>

<section class="sheet" id="themeSheet" aria-label="阅读主题">
  <div class="sheet-head">
    <h2>阅读主题</h2>
    <button class="close" data-close>×</button>
  </div>
  <div class="segment" id="modeSeg">
    <button data-mode="day">日间</button>
    <button data-mode="night">夜间</button>
  </div>
  <div class="label">颜色主题</div>
  <div class="themes" id="themeList"></div>
</section>

<section class="sheet" id="paletteSheet" aria-label="自定义颜色">
  <div class="sheet-head">
    <h2 id="paletteTitle">调色盘</h2>
    <button class="close" data-close>×</button>
  </div>
  <div class="preview" id="preview">
    <div class="pair">
      <p class="src">It was a warm summer evening in Little Whinging.</p>
      <p class="tgt">那是一个在小惠金区温暖的夏日傍晚。</p>
    </div>
    <div class="meta" id="previewMeta"></div>
  </div>
  <div class="label">选择一个颜色</div>
  <div class="picker-row">
    <input type="color" id="colorInput" value="#3a8fd9" aria-label="选择颜色">
    <input type="range" class="hue" id="hueInput" min="0" max="360" value="208" aria-label="色相">
  </div>
  <div class="quick" id="quick"></div>
  <div class="rule" id="ruleText"></div>
  <div class="actions">
    <button class="btn-primary" id="applyBtn">确定使用</button>
    <button class="btn-secondary" id="saveBtn">保存到选项</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
/* ======================= 示例文章（替换这里即可） ======================= */
const ARTICLE = {
  title: ['Chapter 1: The Visitor', '第一章：来访者'],
  blocks: [
    { heading: 'Summary:', pairs: [[
      "Hi! Don't be mad at me if you're one of my readers on my other fic, I'm sorry I've started a new project I just had to I swear.",
      '你好！如果你是我另一篇同人小说的读者，请不要生我的气，我很抱歉我开始了新项目，我发誓我真的不得不这么做。'
    ]]},
    { heading: 'Notes:', pairs: [[
      "Updates will be slow but steady. Thank you for every comment, they genuinely keep me writing.",
      '更新会比较慢，但会坚持下去。谢谢你们的每一条评论，它们真的是我继续写下去的动力。'
    ]]}
  ],
  body: [
    ['It was a warm summer evening in Little Whinging, and Marge Dursley was over to visit her brother and nephew. Harry Potter was upstairs, following the orders of his rotund uncle Vernon to not make a sound. Aunt Petunia dragged him down for dinner.',
     '那是一个在小惠金区温暖的夏日傍晚，玛姬·德思礼来拜访她的哥哥和侄子。哈利·波特在楼上，听从他肥胖的姨父弗农的命令，一声不吭。佩妮姨妈把他拉下楼吃晚饭。'],
    ['Dinner was a tense affair. Aunt Marge talked loudly about her dogs, Uncle Vernon nodded along, and Dudley ate his third helping of pudding without looking up once. Harry kept his eyes on his plate and counted the minutes until he could go back to his room.',
     '晚饭吃得很压抑。玛姬姑妈大声谈论着她的狗，弗农姨父连连点头附和，达力埋头吃着第三份布丁，连头都没抬过一次。哈利一直盯着自己的盘子，数着还有多少分钟才能回到房间。'],
    ['Then the doorbell rang. Nobody in the Dursley household ever expected visitors after seven, and for a moment everyone froze, forks halfway to their mouths.',
     '就在这时，门铃响了。德思礼家从来不会在七点以后等来什么客人，一时间所有人都僵住了，叉子停在半空中。'],
    ['"Get that, boy," Uncle Vernon growled. Harry slid off his chair and walked down the narrow hallway. When he opened the door, a girl about his age was sitting on the front step, a battered trunk beside her and an owl cage balanced on her knees.',
     '“去开门，小子。”弗农姨父低吼道。哈利从椅子上滑下来，穿过狭窄的走廊。他打开门，看见一个和他年纪相仿的女孩坐在门前的台阶上，身边放着一只破旧的箱子，膝盖上稳稳地搁着一个猫头鹰笼子。'],
    ['"If you\'re selling something, we don\'t want it," Harry said automatically, the way Uncle Vernon had taught him. "And if you\'re one of Dudley\'s friends, he\'s eating."',
     '“如果你是来推销东西的，我们不需要。”哈利条件反射般地说，这是弗农姨父教他的说法，“如果你是达力的朋友，他正在吃饭。”'],
    ['The girl quickly cleared her throat, stood up, and replied, "Who\'s Dudley? Do I have the wrong house? I\'m looking for Harry Potter."',
     '女孩清了清嗓子，站起身来，回答道：“达力是谁？我找错房子了吗？我在找哈利·波特。”'],
    ['Harry stared at her. In eleven years, no one had ever come to the door looking for him. "That\'s me," he said slowly. "Who are you?"',
     '哈利盯着她。十一年来，从来没有人上门找过他。“我就是，”他慢慢地说，“你是谁？”'],
    ['The girl smiled, and the owl in the cage gave a soft, approving hoot. "Someone who was told to bring you a letter," she said, "since apparently the last forty went missing."',
     '女孩笑了，笼子里的猫头鹰轻轻叫了一声，像是在表示赞同。“一个被派来给你送信的人，”她说，“毕竟前面那四十封好像都不翼而飞了。”'],
    ['Behind him, Harry heard Uncle Vernon\'s chair scrape loudly across the kitchen floor.',
     '在他身后，哈利听见弗农姨父的椅子在厨房地板上刮出一声刺耳的响动。']
  ]
};

/* ======================= 主题（来自 Figma） ======================= */
const PRESETS = {
  day: [
    { id: 'day-std',    name: '标准', bg: '#f5f5f5', text: '#1a1a1a', eink: true },
    { id: 'day-paper',  name: '米黄', bg: '#f7f4ed', text: '#1f1000' },
    { id: 'day-mint',   name: '薄荷', bg: '#ebf7f3', text: '#001f14' },
    { id: 'day-violet', name: '浅紫', bg: '#f2edf7', text: '#0f001f' },
    { id: 'day-sky',    name: '天青', bg: '#ebf4f7', text: '#00121f' }
  ],
  night: [
    { id: 'night-std',    name: '标准', bg: '#0f0f0f', text: '#fafafa', eink: true },
    { id: 'night-amber',  name: '暖棕', bg: '#1f1306', text: '#fff8ed' },
    { id: 'night-forest', name: '墨绿', bg: '#031a10', text: '#f2fff9' },
    { id: 'night-violet', name: '深紫', bg: '#0e081a', text: '#f8f5ff' },
    { id: 'night-navy',   name: '深蓝', bg: '#071721', text: '#f2fbff' }
  ]
};
const LINE = { day: '#d6d3cd', night: '#3d3d3d' };

/* 调色盘生成规则：取所选颜色的色相，按 Figma 现有主题反推出的固定 饱和度/亮度 生成 */
const RULE = {
  day:   { bg: [45, 95], text: [100, 6] },
  night: { bg: [65, 7],  text: [100, 97] }
};
const QUICK = ['#e25b4b', '#e8913a', '#d9b43a', '#5fae5a', '#3aa89a', '#3a8fd9', '#5c6ad9', '#9a5cd9', '#d95c9e', '#888888'];

/* ======================= 颜色工具 ======================= */
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: s * 100, l: l * 100 };
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round((pa >> s & 255) * (1 - t) + (pb >> s & 255) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function generate(hex, mode) {
  const { h, s } = hexToHsl(hex);
  const gray = s < 8;
  const r = RULE[mode];
  return {
    bg: hslToHex(h, gray ? 0 : r.bg[0], r.bg[1]),
    text: hslToHex(h, gray ? 0 : r.text[0], r.text[1]),
    eink: gray
  };
}

/* ======================= 状态 ======================= */
const STORE_KEY = 'cy-reader-theme-v1';
const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
const state = Object.assign({
  mode: prefersDark ? 'night' : 'day',
  selected: { day: 'day-std', night: 'night-std' },
  temp: { day: null, night: null },
  custom: { day: [], night: [] }
}, JSON.parse(localStorage.getItem(STORE_KEY) || '{}'));
const persist = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));

function allThemes(mode) { return PRESETS[mode].concat(state.custom[mode]); }
function currentTheme() {
  const m = state.mode;
  if (state.selected[m] === 'temp' && state.temp[m]) return state.temp[m];
  return allThemes(m).find(t => t.id === state.selected[m]) || PRESETS[m][0];
}

/* ======================= 渲染 ======================= */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pairHtml = ([src, tgt]) => `<div class="pair"><p class="src" lang="en">${esc(src)}</p><p class="tgt">${esc(tgt)}</p></div>`;

function renderArticle() {
  $('reader').innerHTML =
    `<h1 class="title"><span class="en">${esc(ARTICLE.title[0])}</span><span class="zh">${esc(ARTICLE.title[1])}</span></h1>` +
    ARTICLE.blocks.map(b => `<section class="block"><h3>${esc(b.heading)}</h3>${b.pairs.map(pairHtml).join('')}</section>`).join('') +
    `<div class="divider"></div>` +
    `<article class="body">${ARTICLE.body.map(pairHtml).join('')}</article>`;
}

function applyTheme() {
  const t = currentTheme();
  const root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--text', t.text);
  root.setProperty('--line', LINE[state.mode]);
  root.setProperty('--panel', mix(t.bg, state.mode === 'day' ? '#ffffff' : t.text, state.mode === 'day' ? .7 : .06));
  root.setProperty('--chip', rgba(t.text, .06));
  document.querySelector('meta[name=theme-color]').content = t.bg;
  renderThemeSheet();
}

function chip(t, on) {
  return `<button class="chip${on ? ' on' : ''}" data-id="${t.id}">
    <span class="dot" style="background:${rgba(t.text, .8)}"></span>
    <span>${esc(t.name)}</span>${t.eink ? '<span class="tag">墨水屏</span>' : ''}
    ${t.custom ? `<span class="del" data-del="${t.id}" role="button" aria-label="删除">×</span>` : ''}
  </button>`;
}

function renderThemeSheet() {
  const m = state.mode;
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  let html = allThemes(m).map(t => chip(t, state.selected[m] === t.id)).join('');
  if (state.temp[m]) html += chip({ ...state.temp[m], id: 'temp' }, state.selected[m] === 'temp');
  html += `<button class="chip" id="openPalette"><span class="dot palette-dot"></span><span>调色盘</span></button>`;
  $('themeList').innerHTML = html;
}

/* ======================= 交互 ======================= */
function open(sheet) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('show', s === sheet));
  $('mask').classList.add('show');
}
function closeAll() {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
  $('mask').classList.remove('show');
}
let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1600);
}

$('fab').onclick = () => open($('themeSheet'));
$('mask').onclick = closeAll;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeAll);

$('modeSeg').onclick = e => {
  const m = e.target.dataset.mode;
  if (!m || m === state.mode) return;
  state.mode = m; persist(); applyTheme();
};

$('themeList').onclick = e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const m = state.mode;
    state.custom[m] = state.custom[m].filter(t => t.id !== del.dataset.del);
    if (state.selected[m] === del.dataset.del) state.selected[m] = PRESETS[m][0].id;
    persist(); applyTheme(); toast('已删除');
    return;
  }
  if (e.target.closest('#openPalette')) { openPalette(); return; }
  const c = e.target.closest('.chip');
  if (!c) return;
  state.selected[state.mode] = c.dataset.id; persist(); applyTheme();
};

/* ---------- 调色盘 ---------- */
let draft = null;
function updatePreview(hex) {
  draft = generate(hex, state.mode);
  const p = $('preview');
  p.style.background = draft.bg;
  p.style.color = draft.text;
  $('previewMeta').textContent = `背景 ${draft.bg.toUpperCase()}　文字 ${draft.text.toUpperCase()}`;
}
function openPalette() {
  const isDay = state.mode === 'day';
  $('paletteTitle').textContent = `调色盘 · ${isDay ? '日间' : '夜间'}`;
  $('ruleText').textContent = isDay
    ? '生成规则（日间）：保留所选颜色的色相，背景 = 饱和度 45% · 亮度 95%，文字 = 饱和度 100% · 亮度 6%。选灰色时生成无色相主题，可用于墨水屏。'
    : '生成规则（夜间）：保留所选颜色的色相，背景 = 饱和度 65% · 亮度 7%，文字 = 饱和度 100% · 亮度 97%。选灰色时生成无色相主题，可用于墨水屏。';
  $('quick').innerHTML = QUICK.map(c => `<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
  updatePreview($('colorInput').value);
  open($('paletteSheet'));
}
$('colorInput').oninput = e => {
  $('hueInput').value = Math.round(hexToHsl(e.target.value).h);
  updatePreview(e.target.value);
};
$('hueInput').oninput = e => {
  const hex = hslToHex(+e.target.value, 70, 50);
  $('colorInput').value = hex;
  updatePreview(hex);
};
$('quick').onclick = e => {
  const c = e.target.dataset.c;
  if (!c) return;
  $('colorInput').value = c;
  $('hueInput').value = Math.round(hexToHsl(c).h);
  updatePreview(c);
};
$('applyBtn').onclick = () => {
  const m = state.mode;
  state.temp[m] = { ...draft, id: 'temp', name: '临时' };
  state.selected[m] = 'temp';
  persist(); applyTheme(); closeAll(); toast('已应用');
};
$('saveBtn').onclick = () => {
  const m = state.mode;
  const id = 'custom-' + Date.now();
  state.custom[m].push({ ...draft, id, name: '自定义' + (state.custom[m].length + 1), custom: true });
  state.selected[m] = id;
  state.temp[m] = null;
  persist(); applyTheme(); open($('themeSheet')); toast('已保存到选项');
};

renderArticle();
applyTheme();
</script>
</body>
</html>
